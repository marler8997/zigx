name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: windows-11-arm
          # Pin macOS to macos-15; macos-latest's Xcode 26.4 SDK doesn't link
          # with Zig 0.15.2 (ziglang/zig#31658), fixed in later Zig versions.
          - os: macos-15
          - os: ubuntu-latest
    runs-on: ${{matrix.os}}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: marler8997/setup-anyzig@master

      - name: Build 0.15.2
        run: zig 0.15.2 build --summary all install test-non-interactive

      - name: Build 0.16.0
        run: zig 0.16.0 build --summary all install test-non-interactive
